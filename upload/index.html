<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>오늘의 사진 올리기</title><link rel="stylesheet" href="./upload.css"></head><body><main><p class="eyebrow">WEDDING MOMENTS</p><h1>오늘의 사진을<br>함께 남겨주세요</h1><p class="intro">찍은 사진은 두 사람에게 소중한 선물이 됩니다.<br>한 번에 최대 10장까지 올릴 수 있어요.</p><form id="upload-form"><label class="picker" for="photos"><strong>사진 선택</strong><span id="file-label">사진을 선택해주세요 · 최대 10장</span></label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><div id="previews" class="previews" aria-live="polite"></div><button id="submit" type="submit" disabled>사진 올리기</button><p id="status" role="status"></p></form><p class="notice">올린 사진은 예식 기록 화면에 공개될 수 있습니다.</p></main><script type="module" src="./upload.js"></script></body></html>
